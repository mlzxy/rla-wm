vars:
  debug: false
  img_size: 512
  dino_channels: 1024
  model_channels: ${vars.dino_channels}
  flow_model_channels: 1024
  num_heads: 16

  # Encoder/decoder arch (frozen)
  enc_num_blocks: 12
  latent_num_tokens: 32
  token_dim: 64

  # Flow model arch
  num_cond_blocks: 8
  num_flow_blocks: 8

  horizon: 15
  num_frames: 2
  max_horizon: ${vars.horizon}

wandb:
  enabled: true
  project: "rla-wm"
  entity: "xz653"
  name: ""
  tags: []
  notes: ""


models:
  # ── Frozen encoder (loaded from checkpoint) ──
  encoder:
    name: SimpleTokenTransformer
    args:
      in_channels: ${vars.dino_channels}
      model_channels: ${vars.model_channels}
      out_channels: ${vars.token_dim}
      num_blocks: ${vars.enc_num_blocks}
      num_heads: 16
      mlp_ratio: 4.0
      use_fp16: true
      num_tokens: ${vars.latent_num_tokens}

  # ── Frozen decoder (loaded from checkpoint) ──
  decoder:
    name: SimpleTokenTransformer
    args:
      in_channels: ${vars.dino_channels}
      model_channels: ${vars.model_channels}
      out_channels: ${vars.dino_channels}
      token_channels: ${vars.token_dim}
      num_blocks: ${vars.enc_num_blocks}
      num_heads: 16
      mlp_ratio: 4.0
      use_fp16: true
      num_tokens: ${vars.latent_num_tokens}
      zero_init: true

  # ── Frozen image decoder ──
  image_decoder:
    name: DinoToImageDecoderV1
    args:
      in_channels: ${vars.dino_channels}
      model_channels: ${vars.model_channels}
      out_channels: 3
      use_fp16: true

  # ── Trainable flow model ──
  flow_model:
    name: RLAWM
    args:
      model_channels: ${vars.model_channels}
      token_dim: ${vars.token_dim}
      dino_channels: ${vars.dino_channels}
      num_cond_blocks: ${vars.num_cond_blocks}
      num_flow_blocks: ${vars.num_flow_blocks}
      flow_model_channels: ${vars.flow_model_channels}
      num_heads: ${vars.num_heads}
      mlp_ratio: 4.0
      use_fp16: true
      num_tasks: 8
      max_horizon: ${vars.max_horizon}
      robot_qpos_dims:
        "0": 9    # panda
        # "1": 12   # xarm6_robotiq
        # "2": 6    # ur10e_stick
      qpos_frame_channels: 64
      use_task_horizon_embedding: false


dataset:
  name: TrajectoryDataset
  args:
    root: data/maniskill
    configs:
      play_panda:
        paths: ["play/panda/TableOnly-v2/*"]
        w: 0.0
        min_start_frame: 25
      ppo_panda:
        paths: ["ppo/panda/PullCube-v2/*", "ppo/panda/PullCubeTool-v1/*"]
        w: 1.0
      
    max_num_cameras: 7
    start_traj_id: 10
    min_num_frames: 5

    num_frames: ${vars.num_frames}
    horizon: 
      - ${vars.num_frames}
      - ${vars.horizon}
    manual_limit: 1000000

    read_optional_streams: False
    interaction_prob: 0.9
    interaction_detect:
      dist_threshold: 0.25
      movement_threshold: 0.002
      buffer_window: 3

    img_size: ${vars.img_size}
    augmentations: null
    cameras: ["front_lower_camera"]
    trajectory_info_cache_file: runs/cache/dataset_idx/mar27.panda.frontend.num_frames${vars.num_frames}_h${vars.num_frames}-${vars.horizon}.simple.all.json


val_dataset:
  name: TrajectoryDataset
  args:
    root: data/maniskill
    configs:
      ppo_panda:
        paths: ["ppo/panda/PullCube-v2/*", "ppo/panda/PullCubeTool-v1/*"]
        w: 1.0 
      
    read_optional_streams: False
    max_num_cameras: 7
    min_num_frames: 5
    start_traj_id: 0
    end_traj_id: 9

    num_frames: ${vars.num_frames}
    manual_limit: 1000000

    horizon: 
      - 10
      - ${vars.horizon}

    interaction_prob: 0.9
    interaction_detect:
      dist_threshold: 0.25
      movement_threshold: 0.002
      buffer_window: 3

    cameras: ["front_lower_camera"]
    img_size: ${vars.img_size}
    augmentations: null


trainer:
  name: RLAWMTrainer
  args:
    max_steps: 1000000
    batch_size: 64 # 64
    batch_split: 1
    optimizer:
      name: AdamW
      args:
        lr: 0.0001
        weight_decay: 0.0
    ema_rate: []
    fp16_mode: inflat_all
    fp16_scale_growth: 0.001
    i_log: 50
    i_sample: 2500
    i_save: 2500
    save_latest_only: true
    num_workers: 5
    num_samples: 8
    load_dir: null
    skip_load_misc: true
    debug: ${vars.debug}

    # Flow matching
    sigma_min: 1.0e-5
    t_schedule:
      name: logitNormal
      args:
        mean: 0.0
        std: 1.0

    # Losses
    lambda_mse: 1.0
    lambda_l1: 1.0

    # DINO
    dino_channels: ${vars.dino_channels}

    # Frozen model checkpoints
    freeze_models: ["encoder", "decoder", "image_decoder"]
    encoder_ckpt: "runs/weights/rla/maniskill/20260323_21-41-25"
    image_decoder_ckpt: "runs/weights/dino-to-image_unet/maniskill/20260404_22-53-36"

    # Snapshot
    snapshot_eval_samples: 200
    snapshot_eval_seed: 2026
    skip_initial_snapshot: false
    use_centroid_per_dim_normalization: false

# -------------------------------------------------------------------
# Stage 2 - Multi-view RLA autoencoder for the SO-101 real-world dataset (16 x 16 latent)
# -------------------------------------------------------------------
# Inverse-dynamics autoencoder over frozen DINOv3 tokens of the front + wrist views:
#
#   encoder(DINO(x_T) - DINO(x_0))            -> 16 latent tokens x 16 dim   <- the "latent action"
#   decoder(DINO(x_0), tokens=latent)         -> DINO(x_T)
#   image_decoder(DINO(x_T))                  -> RGB                          (frozen, stage 1)
#
# The frame gap (x_0 -> x_T) is re-sampled every batch in [1, vars.horizon - 1].
#
# Downstream, rebuttal/exp4_so101/precompute_rla_latents.py runs this trained encoder over every frame
# at the gaps the policy needs -- [4, 8, ..., 32] for the 8-rung ladder, 32 for "final", spanning the
# policy `horizon` -- and the BC-RLA policy regresses those stored targets. So this run must be good
# across the WHOLE range [1, 32], not just at one gap: hence uniform gap sampling below, and
# vars.horizon: 64, which keeps 32 well inside the trained range with margin to spare.
#
# PREREQUISITE: `image_decoder_ckpt` must point at a finished stage-1 UNet run.
# RlaAutoencoderTrainer.__init__ loads it with strict=True, so a wrong/empty path fails at startup.
#
#   .venv/bin/python train.py \
#     --config rebuttal/exp4_so101/configs/rla/16x16_so101_dual.yaml \
#     --output_dir runs/so101 --num_gpus 2
#
# Output: runs/so101/16x16_so101_dual/<timestamp>/   <- paste into the BC-RLA policy configs.

vars:
  debug: false
  img_size: 320 # 320/16 = 20x20 = 400 DINO patches per view; 2 views -> 800 tokens
  dino_channels: 1024 # -> DINOv3 ViT-L/16
  model_channels: ${vars.dino_channels}
  num_heads: 16
  num_blocks: 12

  # 16 tokens x 16 dim = 256 numbers per latent action. Small on purpose: it is a tight
  # bottleneck for the policy to regress, and the precomputed sidecars stay small
  # (16 gaps x 256 values x 2 bytes = 8 KB per frame, ~340 MB for the whole dataset).
  latent_num_tokens: 16
  token_dim: 16

  num_views: 2 # front + wrist

  horizon: 64 # max x_0 -> x_T gap in frames (2.13 s at 30 fps); >= 2x the policy horizon of 32
  num_frames: 2

wandb:
  enabled: true
  project: "rla-wm"
  name: ""
  tags: ["so101", "realworld", "rla", "multiview", "16x16"]
  notes: "SO-101 aug2-dual-camera, front+wrist, 16x16 latent @320px, learned pos embed (no plucker)"


models:
  encoder:
    name: MultiViewTokenTransformer
    args:
      in_channels: ${vars.dino_channels}
      model_channels: ${vars.model_channels}
      out_channels: ${vars.token_dim}
      num_blocks: ${vars.num_blocks}
      num_heads: ${vars.num_heads}
      mlp_ratio: 4.0
      use_fp16: true
      num_tokens: ${vars.latent_num_tokens}
      norm_output_tokens: false
      num_views: ${vars.num_views}
      use_view_embed: true # one learned vector per camera, so tokens carry front-vs-wrist identity
      # "plucker" would need real intrinsics/extrinsics, which this dataset does not have (the
      # converter writes placeholders only to satisfy an unconditional dict lookup). "learned" gives
      # a per-patch-slot embedding shared across views and needs no camera geometry, so
      # expects_plucker stays False and _plucker_rays short-circuits.
      pos_embed_mode: learned
      max_tokens_per_view: 1024

  decoder:
    name: MultiViewTokenTransformer
    args:
      in_channels: ${vars.dino_channels}
      model_channels: ${vars.model_channels}
      out_channels: ${vars.dino_channels}
      token_channels: ${vars.token_dim}
      num_blocks: ${vars.num_blocks}
      num_heads: ${vars.num_heads}
      mlp_ratio: 4.0
      use_fp16: true
      num_tokens: ${vars.latent_num_tokens}
      zero_init: true
      num_views: ${vars.num_views}
      use_view_embed: true
      pos_embed_mode: learned
      max_tokens_per_view: 1024

  image_decoder:
    name: DinoToImageDecoderV1
    args:
      in_channels: ${vars.dino_channels}
      model_channels: ${vars.model_channels}
      out_channels: 3
      use_fp16: true


dataset:
  name: TrajectoryDataset
  args:
    root: data/realworld/so101_converted
    configs:
      so101_cup:
        paths: ["."]
        w: 1.0

    max_num_cameras: ${vars.num_views}
    start_traj_id: "000000"
    end_traj_id: "000119"
    min_num_frames: 5

    num_frames: ${vars.num_frames}
    horizon:
      - ${vars.num_frames}
      - ${vars.horizon}
    manual_limit: 1000000

    read_optional_streams: False
    interaction_prob: 0.0
    interaction_detect: null

    img_size: ${vars.img_size}
    augmentations: null
    cameras: ["front_camera", "wrist_camera"]
    trajectory_info_cache_file: runs/cache/dataset_idx/16x16_so101_dual.train120.num_frames${vars.num_frames}_h${vars.num_frames}-${vars.horizon}.json
    # Uniform gap sampling. The policy's latent target sits at a fixed 32-frame gap, so uniform
    # coverage of [1, 63] is preferable to the Beta(5,2) skew towards the longest gaps.
    nonlinear_sampling: false
    bg_mask_top: 0.0


val_dataset:
  name: TrajectoryDataset
  args:
    root: data/realworld/so101_converted
    configs:
      so101_cup:
        paths: ["."]
        w: 1.0

    max_num_cameras: ${vars.num_views}
    start_traj_id: "000110"
    end_traj_id: "000119"
    min_num_frames: 5

    num_frames: ${vars.num_frames}
    horizon:
      - 10
      - ${vars.horizon}
    manual_limit: 1000000

    read_optional_streams: False
    interaction_prob: 0.0
    interaction_detect: null

    img_size: ${vars.img_size}
    augmentations: null
    cameras: ["front_camera", "wrist_camera"]
    trajectory_info_cache_file: runs/cache/dataset_idx/16x16_so101_dual.val.num_frames${vars.num_frames}_h10-${vars.horizon}.json
    nonlinear_sampling: false
    bg_mask_top: 0.0


trainer:
  name: RlaAutoencoderMultiViewTrainer
  args:
    max_steps: 1000000
    # At 320px the sequence is 800 tokens (vs 392 at 224), so attention costs ~4x: a
    # training step peaks at 26.5 GiB for 32 samples (measured, 46 GB RTX 6000 Ada).
    # batch_split=2 keeps the effective batch at 64 through gradient accumulation.
    batch_size: 64
    batch_split: 2
    optimizer:
      name: AdamW
      args:
        lr: 1e-4
        weight_decay: 0.0
    ema_rate: []
    fp16_mode: inflat_all
    fp16_scale_growth: 0.001
    i_log: 50
    i_sample: 2500
    i_save: 2500
    save_latest_only: true
    num_workers: 6
    num_samples: 8

    # From scratch. (The ManiSkill RLA is 32x64, so its `tokens` [32,1024] and `out_layer`
    # [64,1024] do not match a 16x16 model, and load_state_dict rejects shape mismatches even
    # with strict=False -- a warm start would need a filtered checkpoint, and is not worth it.)
    load_dir: null
    load_strict: true
    debug: ${vars.debug}

    num_views: ${vars.num_views}

    lambda_l1: 1.0
    lambda_mse: 1.0

    dino_channels: ${vars.dino_channels}
    freeze_models: ["image_decoder"]
    # <<< SET THIS to the stage-1 UNet run dir, e.g. runs/so101/dino_to_image_so101/<timestamp>
    # Loaded with strict=True after everything else, so it is the final word on the renderer used
    # for snapshots here and for the world-model visualisation on the robot machine.
    image_decoder_ckpt: "runs/so101/dino_to_image_so101/20260802_19-25-13"

    snapshot_eval_samples: 200
    snapshot_eval_seed: 2026
    skip_initial_snapshot: true # nothing to see before any training

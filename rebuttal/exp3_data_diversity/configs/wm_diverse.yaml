
# RLA-WM flow model for Push-T, trained on the diverse Push-T collection.
#
# The mixture is 50/50 by design, and both halves are needed:
#   50%  ppo_diverse/success  one success per distinct goal, 5 004 goals, with the ten
#        evaluation goals excluded at a 25 mm margin. Shows the block following the marker.
#   50%  rerender/noisy       existing rollouts replayed action-for-action with ONLY the goal
#        marker moved. Shows the marker moving while the block does not follow.
# Together they pin down "the block follows the pusher, and the pusher can be sent anywhere"
# instead of "the block ends at the marker", which is the prior the old model had learned
# from a training set where the marker never moved.
#
#   PYTHONPATH=.:./third_party/diffusion_policy .venv/bin/python train.py \
#       --config rebuttal/exp3_data_diversity/configs/wm_diverse.yaml \
#       --output_dir runs/pusht_diverse --num_gpus 4
#
# encoder_work_dir below must hold exactly ONE encoder and ONE decoder checkpoint.
# fetch_state_dict with step=None takes the lexicographically last match, so a directory
# with many saves would pair the encoder you meant with whatever decoder is newest -- no
# error, no warning, just a world model whose tokens are decoded by the wrong map.
# The released pin is runs/pusht_diverse/frozen/rla_diverse_step0006000 (see ../../DATA.md).
vars:
  debug: false
  img_size: 512
  dino_channels: 1024
  model_channels: ${vars.dino_channels}
  flow_model_channels: 1024
  num_heads: 16
  enc_num_blocks: 12
  latent_num_tokens: 32
  token_dim: 64
  num_cond_blocks: 8
  num_flow_blocks: 8
  horizon: 15
  num_frames: 2
  max_horizon: ${vars.horizon}
wandb:
  enabled: true
  project: rla-wm
  name: ''
  tags:
  - pusht-diverse
  - pusht
  - wm-scratch
  notes: Push-T RLA-WM from scratch on diverse data
models:
  encoder:
    name: SimpleTokenTransformer
    args:
      in_channels: ${vars.dino_channels}
      model_channels: ${vars.model_channels}
      out_channels: ${vars.token_dim}
      num_blocks: ${vars.enc_num_blocks}
      num_heads: 16
      mlp_ratio: 4.0
      use_fp16: true
      num_tokens: ${vars.latent_num_tokens}
  decoder:
    name: SimpleTokenTransformer
    args:
      in_channels: ${vars.dino_channels}
      model_channels: ${vars.model_channels}
      out_channels: ${vars.dino_channels}
      token_channels: ${vars.token_dim}
      num_blocks: ${vars.enc_num_blocks}
      num_heads: 16
      mlp_ratio: 4.0
      use_fp16: true
      num_tokens: ${vars.latent_num_tokens}
      zero_init: true
  image_decoder:
    name: DinoToImageDecoderV1
    args:
      in_channels: ${vars.dino_channels}
      model_channels: ${vars.model_channels}
      out_channels: 3
      use_fp16: true
  flow_model:
    name: RLAWM
    args:
      model_channels: ${vars.model_channels}
      token_dim: ${vars.token_dim}
      dino_channels: ${vars.dino_channels}
      num_cond_blocks: ${vars.num_cond_blocks}
      num_flow_blocks: ${vars.num_flow_blocks}
      flow_model_channels: ${vars.flow_model_channels}
      num_heads: ${vars.num_heads}
      mlp_ratio: 4.0
      use_fp16: true
      num_tasks: 8
      max_horizon: ${vars.max_horizon}
      robot_qpos_dims:
        '2': 6
      qpos_frame_channels: 64
      use_task_horizon_embedding: false
dataset:
  name: TrajectoryDataset
  args:
    root: data/maniskill
    configs:
      diverse:
        paths:
        - ppo_diverse/ur10e_stick/PushT-v2/success
        w: 0.5
      rr_noisy:
        paths:
        - rerender/ur10e_stick/PushT-v2/noisy
        w: 0.5
    max_num_cameras: 1
    start_traj_id: 0
    min_num_frames: 5
    num_frames: ${vars.num_frames}
    horizon:
    - ${vars.num_frames}
    - ${vars.horizon}
    manual_limit: 1000000
    read_optional_streams: false
    interaction_prob: 0.9
    interaction_detect:
      dist_threshold: 0.25
      movement_threshold: 0.002
      buffer_window: 3
    img_size: ${vars.img_size}
    augmentations: null
    cameras:
    - front_lower_camera
    trajectory_info_cache_file: runs/cache/dataset_idx/exp3.wm.diverse.train.json
val_dataset:
  name: TrajectoryDataset
  args:
    root: data/maniskill
    configs:
      eval_goals:
        paths:
        - ppo_noisy/ur10e_stick/PushT-v2/novel/goal0
        - ppo_noisy/ur10e_stick/PushT-v2/novel/goal1
        - ppo_noisy/ur10e_stick/PushT-v2/novel/goal2
        - ppo_noisy/ur10e_stick/PushT-v2/novel/goal3
        - ppo_noisy/ur10e_stick/PushT-v2/novel/goal4
        - ppo_noisy/ur10e_stick/PushT-v2/novel/goal5
        w: 1.0
    read_optional_streams: false
    max_num_cameras: 1
    min_num_frames: 5
    start_traj_id: 0
    end_traj_id: 49
    num_frames: ${vars.num_frames}
    manual_limit: 1000000
    horizon:
    - 10
    - ${vars.horizon}
    interaction_prob: 0.9
    interaction_detect:
      dist_threshold: 0.25
      movement_threshold: 0.002
      buffer_window: 3
    cameras:
    - front_lower_camera
    img_size: ${vars.img_size}
    augmentations: null
    trajectory_info_cache_file: runs/cache/dataset_idx/exp3.wm.diverse.val.json
trainer:
  name: RLAWMTrainer
  args:
    max_steps: 1000000
    batch_size: 64
    batch_split: 1
    optimizer:
      name: AdamW
      args:
        lr: 0.0001
        weight_decay: 0.0
    ema_rate: []
    fp16_mode: inflat_all
    fp16_scale_growth: 0.001
    i_log: 50
    i_sample: 2500
    i_save: 5000
    save_latest_only: false
    num_workers: 5
    num_samples: 8
    # The run this trained from is not shipped -- only its product,
    # runs/pusht_diverse/frozen/wm_diverse_step0025000, is. Set this to null to train
    # the flow model from random init on the same mixture.
    load_dir: runs/pusht_diverse/wm_markerrand/20260730_10-42-38
    skip_load_misc: true
    debug: ${vars.debug}
    sigma_min: 1.0e-05
    t_schedule:
      name: logitNormal
      args:
        mean: 0.0
        std: 1.0
    lambda_mse: 1.0
    lambda_l1: 1.0
    dino_channels: ${vars.dino_channels}
    freeze_models:
    - encoder
    - decoder
    - image_decoder
    encoder_ckpt: runs/pusht_diverse/frozen/rla_diverse_step0006000
    encoder_step: 6000 # important
    image_decoder_ckpt: runs/pusht_diverse/frozen/unet_pusht_noisy_step50000
    snapshot_eval_samples: 200
    snapshot_eval_seed: 2026
    skip_initial_snapshot: false
    use_centroid_per_dim_normalization: false

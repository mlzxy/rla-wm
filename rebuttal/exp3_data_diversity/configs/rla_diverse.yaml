
# RLA autoencoder for Push-T, trained on the diverse Push-T collection.
#
# Run this first. wm_diverse.yaml consumes this run's encoder and decoder, so the order is:
# this -> pin one encoder/decoder pair into a directory of its own -> train the world model.
# The flow model predicts a latent that *this* autoencoder defines, so re-running the
# autoencoder invalidates every flow-model checkpoint trained against the old latent space.
#
#   PYTHONPATH=.:./third_party/diffusion_policy .venv/bin/python train.py \
#       --config rebuttal/exp3_data_diversity/configs/rla_diverse.yaml \
#       --output_dir runs/pusht_diverse --num_gpus 4
#
# The released pin is runs/pusht_diverse/frozen/rla_diverse_step0006000 (see ../../DATA.md).
vars:
  debug: false
  img_size: 512
  dino_channels: 1024
  model_channels: ${vars.dino_channels}
  num_heads: 16
  num_blocks: 12
  latent_num_tokens: 32
  token_dim: 64
  horizon: 100
  num_frames: 2
wandb:
  enabled: true
  project: rla-wm
  name: ''
  tags:
  - pusht-diverse
  - pusht
  - rla-scratch
  - ablation
  notes: Push-T RLA trained on the diverse Push-T collection
models:
  encoder:
    name: SimpleTokenTransformer
    args:
      in_channels: ${vars.dino_channels}
      model_channels: ${vars.model_channels}
      out_channels: ${vars.token_dim}
      num_blocks: ${vars.num_blocks}
      num_heads: 16
      mlp_ratio: 4.0
      use_fp16: true
      num_tokens: ${vars.latent_num_tokens}
  decoder:
    name: SimpleTokenTransformer
    args:
      in_channels: ${vars.dino_channels}
      model_channels: ${vars.model_channels}
      out_channels: ${vars.dino_channels}
      token_channels: ${vars.token_dim}
      num_blocks: ${vars.num_blocks}
      num_heads: 16
      mlp_ratio: 4.0
      use_fp16: true
      num_tokens: ${vars.latent_num_tokens}
      zero_init: true
  image_decoder:
    name: DinoToImageDecoderV1
    args:
      in_channels: ${vars.dino_channels}
      model_channels: ${vars.model_channels}
      out_channels: 3
      use_fp16: true
dataset:
  name: TrajectoryDataset
  args:
    root: data/maniskill
    configs:
      diverse:
        paths:
        - ppo_diverse/ur10e_stick/PushT-v2/success
        w: 0.5
      rr_noisy:
        paths:
        - rerender/ur10e_stick/PushT-v2/noisy
        w: 0.5
    max_num_cameras: 1
    start_traj_id: 0
    min_num_frames: 5
    num_frames: ${vars.num_frames}
    horizon:
    - ${vars.num_frames}
    - ${vars.horizon}
    manual_limit: 1000000
    read_optional_streams: false
    interaction_prob: 0.9
    interaction_detect:
      dist_threshold: 0.25
      movement_threshold: 0.002
      buffer_window: 3
    img_size: ${vars.img_size}
    augmentations: null
    cameras:
    - front_lower_camera
    trajectory_info_cache_file: runs/cache/dataset_idx/exp3.rla.diverse.train.json
    nonlinear_sampling: false
val_dataset:
  name: TrajectoryDataset
  args:
    root: data/maniskill
    configs:
      eval_goals:
        paths:
        - ppo_noisy/ur10e_stick/PushT-v2/novel/goal0
        - ppo_noisy/ur10e_stick/PushT-v2/novel/goal1
        - ppo_noisy/ur10e_stick/PushT-v2/novel/goal2
        - ppo_noisy/ur10e_stick/PushT-v2/novel/goal3
        - ppo_noisy/ur10e_stick/PushT-v2/novel/goal4
        - ppo_noisy/ur10e_stick/PushT-v2/novel/goal5
        w: 1.0
    read_optional_streams: false
    max_num_cameras: 1
    min_num_frames: 5
    start_traj_id: 0
    end_traj_id: 49
    num_frames: ${vars.num_frames}
    manual_limit: 1000000
    horizon:
    - 10
    - ${vars.horizon}
    interaction_prob: 0.9
    interaction_detect:
      dist_threshold: 0.25
      movement_threshold: 0.002
      buffer_window: 3
    cameras:
    - front_lower_camera
    img_size: ${vars.img_size}
    augmentations: null
    trajectory_info_cache_file: runs/cache/dataset_idx/exp3.rla.diverse.val.json
    nonlinear_sampling: false
trainer:
  name: RlaAutoencoderTrainer
  args:
    max_steps: 1000000
    batch_size: 64
    batch_split: 1
    optimizer:
      name: AdamW
      args:
        lr: 0.0001
        weight_decay: 0.0
    ema_rate: []
    fp16_mode: inflat_all
    fp16_scale_growth: 0.001
    i_log: 50
    i_sample: 2500
    i_save: 5000
    save_latest_only: false
    num_workers: 5
    num_samples: 8
    # Continues an earlier run of this same config. That run is not shipped -- only its
    # product, runs/pusht_diverse/frozen/rla_diverse_step0006000, is. Set this to null to
    # train the autoencoder from random init on the same mixture.
    load_dir: runs/pusht_diverse/rla_diverse/20260730_16-59-18
    skip_load_misc: true
    debug: ${vars.debug}
    lambda_l1: 1.0
    lambda_mse: 1.0
    dino_channels: ${vars.dino_channels}
    freeze_models:
    - image_decoder
    image_decoder_ckpt: runs/pusht_diverse/frozen/unet_pusht_noisy_step50000
    snapshot_eval_samples: 200
    snapshot_eval_seed: 2026
    skip_initial_snapshot: false

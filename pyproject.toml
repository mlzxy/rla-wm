[project]
# A brief, descriptive name for your project
name = "v4world"
# A concise description of what your project does
description = "Project for truly cross-embodiment robot learning."
# The version of your project (you should update this as you go)
version = "0.1.0"
# Specify the Python versions your project is compatible with
requires-python = "==3.10.*"
# Assuming 3.9+ for these modern dependencies

# List of project dependencies 
# These are the packages required for the project to run
dependencies = [
    "decord>=0.6.0",
    #"diff-gaussian-rasterization",
    "easydict>=1.13",
    "h5py>=3.15.1",
    "huggingface-hub>=0.36.0",
    "igraph>=1.0.0",
    "imageio>=2.37.2",
    "imageio-ffmpeg>=0.6.0",
    "jaxtyping>=0.3.4",
    "jstyleson>=0.0.2",
    "lpips>=0.1.4",
    "mani-skill==3.0.0b22",
    "ninja>=1.13.0",
    #"nvdiffrast",
    "onnxruntime>=1.23.2",
    "open-clip-torch>=3.2.0",
    "opencv-python-headless>=4.12.0.88",
    "pandas>=2.3.3",
    "peft>=0.19.0",
    "pillow>=12.0.0",
    "pudb>=2025.1.5",
    "pymeshfix>=0.17.2",
    "pytorch-kinematics>=0.7.6",
    "rembg>=2.0.69",
    "rerun-sdk>=0.27.2",
    "roma>=1.5.4",
    "omegaconf>=2.3.0",
    "ruamel-yaml>=0.18.16",
    "scipy>=1.15.3",
    "tensorboard>=2.20.0",
    "torch==2.8.0",
    "torch-cluster>=1.6.3",
    "torch-geometric>=2.7.0",
    "torch-scatter>=2.1.2",
    "torchaudio==2.8.0",
    "torchvision==0.23.0",
    "tqdm>=4.67.1",
    "transformers>=4.57.3",
    "trimesh>=4.10.0",
    "utils3d",
    "wandb>=0.23.1",
    "xatlas>=0.0.11",
    "gsplat>=1.5.3",
    "albumentations>=2.0.8",
    "lz4>=4.4.5",
    "k3d>=2.17.0",
    "pyinstrument>=5.1.2",
    "scalene>=2.0.1",
    "bokeh>=3.8.2",
    "tensordict>=0.11.0",
    "optuna>=4.7.0",
    "zarr>=2.18.2",
    "shapely>=2.1.2",
    "interpolatepy>=2.0.0",
    "hydra-core>=1.3.0",
    "diffusers>=0.21.4",
    "dill>=0.3.5",
    "av>=17.0.0",
    "clean-fid>=0.1.35",
]

# Optional: Add authors for your project
authors = [{ name = "Xinyu Zhang", email = "xz653@rutgers.edu" }]

# Optional: Specify the licenses for your project
license = { text = "MIT" }

# Optional: Set the classifiers to help users find your project
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
]

[tool.uv]
find-links = [
    "https://data.pyg.org/whl/torch-2.8.0+cu128.html",
]
no-build-isolation-package = [
    "diff-gaussian-rasterization",
    "nvdiffrast",
    "torch-scatter",
    "torch-cluster",
]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
utils3d = { git = "https://github.com/EasternJournalist/utils3d.git", rev = "9a4eb15e4021b67b12c460c7057d642626897ec8" }
diff-gaussian-rasterization = { git = "https://github.com/autonomousvision/mip-splatting.git", subdirectory = "submodules/diff-gaussian-rasterization" }
nvdiffrast = { git = "https://github.com/NVlabs/nvdiffrast.git" }
torch-cluster = { url = "https://data.pyg.org/whl/torch-2.8.0%2Bcu128/torch_cluster-1.6.3%2Bpt28cu128-cp310-cp310-linux_x86_64.whl" }
torch-scatter = { url = "https://data.pyg.org/whl/torch-2.8.0%2Bcu128/torch_scatter-2.1.2%2Bpt28cu128-cp310-cp310-linux_x86_64.whl" }

[tool.ruff.lint]
ignore = ['F722']

[tool.pyright]
exclude = ["**/node_modules", "**/__pycache__", "**/build", "**/dist", "**/.venv", "**/.git", "data/**", "runs/**", "tmp/**", "logs/**", "tmp_output/**"]
extraPaths = ["./third_party/diffusion_policy"]


[tool.ty.rules]
unresolved-attribute = "ignore"
invalid-assignment = "warn"
invalid-argument-type = "warn"

[tool.ty.environment]
python = "./.venv"
extra-paths = ["./third_party/diffusion_policy"]

[tool.ty.src]
exclude = ["**/node_modules", "**/__pycache__", "**/build", "**/dist", "**/.venv", "**/.git", "data/**", "runs/**", "tmp/**", "logs/**", "tmp_output/**"]



[dependency-groups]
dev = [
    "cd-fvd>=0.1.1",
    "fast-pytorch-kmeans>=0.2.2",
    "flash-kmeans>=0.2.0",
    "ipykernel>=6.29.5",
    "ipympl>=0.9.8",
    "jupytext>=1.18.1",
    "marimo>=0.20.4",
    "pacmap>=0.9.1",
    "pymunk>=7.2.0",
    "pyvista[all]>=0.46.4",
    "umap-learn>=0.5.11",
]

# to setup the environment, run:
# `MAX_JOBS=1 uv sync` 

# please use 
# - CUDA 12.8 
# - gcc 15.2.0 (verified via a conda gcc installation)
# otherwise the `uv sync` command may fail.

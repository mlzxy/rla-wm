# -------------------------------------------------------------------
# Few-shot BC Policy (no RLA) — robot-data only baseline
# -------------------------------------------------------------------
#
# Usage:
#   python policies/train_policy.py --config-name=fewshot/bc
#   python policies/train_policy.py --config-name=fewshot/bc n_shots=25
#   python policies/train_policy.py --config-name=fewshot/bc n_shots=10 setting=2

hydra:
  run:
    dir: ${eval:'"runs/policy_outputs/debug" if ${training.debug} else "runs/policy_outputs"'}/${setting}_fewshot_bc_${n_shots}shot

_target_: policies.workspace.train_vla_bc_workspace.TrainVLABCWorkspace

# ---- Few-shot control ----
n_shots: 10   # number of robot-data trajectories (override: n_shots=25)

# ---- Task / Robot ----
# 0: PushT-v2, ur10e_stick
# 1: RollBall-v1, ur10e_stick
# 2: PullCube-v2, panda
# 3: PullCubeTool-v1, panda
# 4: PegInsertionSide-v1, xarm6_robotiq
# 5: PokeCube-v2, xarm6_robotiq
setting: 0
task: ${eval:'["PushT-v2","RollBall-v1","PullCube-v2","PullCubeTool-v1","PegInsertionSide-v1","PokeCube-v2"][${setting}]'}
robot: ${eval:'["ur10e_stick","ur10e_stick","panda","panda","xarm6_robotiq","xarm6_robotiq"][${setting}]'}
control_mode: pd_joint_pos

# ---- Horizon ----
horizon: 12
n_obs_steps: 1
n_action_steps: 8

# ---- Image ----
img_size: 512
policy_img_size: 128
num_cameras: 1
cameras:
  - front_lower_camera

# ---- Dimensions (resolved from robot) ----
action_dim: ${eval:'5 if "${robot}" == "ur10e_stick" else 8 if "${robot}" == "panda" else 7 if "${robot}" == "xarm6_robotiq" else -1'}
state_dim: ${eval:'6 if "${robot}" == "ur10e_stick" else 9 if "${robot}" == "panda" else 12 if "${robot}" == "xarm6_robotiq" else -1'}

# ---- Policy (Unified architecture, no latent head) ----
policy:
  _target_: policies.policy.vla_bc_policy_rla_unified.VLABCPolicyRLAUnified
  action_dim: ${action_dim}
  state_dim: ${state_dim}
  num_cameras: ${num_cameras}
  horizon: ${horizon}
  n_obs_steps: ${n_obs_steps}
  n_action_steps: ${n_action_steps}
  per_camera_dim: 512
  use_group_norm: true
  share_backbone: false
  img_size: ${img_size}
  resize_shape:
    - ${policy_img_size}
    - ${policy_img_size}
  crop_shape: null
  random_crop: true
  imagenet_norm: false
  state_hidden_dim: 256
  state_output_dim: 256
  # spatial attention trunk
  spatial_hidden_dim: 256
  spatial_num_blocks: 6
  spatial_num_heads: 8
  spatial_mlp_ratio: 4.0
  # output queries & shared MLP
  num_output_queries: 16
  shared_mlp_dim: 2048
  mlp_dropout: 0.1
  loss_type: mse
  use_latent_head: false

# ---- Dataset (robot-data only, n_shots trajectories) ----
dataset:
  dataset_dir: data/maniskill_jpgs/ppo/${robot}/${task}/success
  cameras: ${cameras}
  horizon: ${horizon}
  pad_before: 0
  pad_after: 7
  img_size: ${img_size}
  seed: 42
  val_ratio: 0.0
  max_train_episodes: null
  max_val_episodes: null
  start_traj_id: 0
  end_traj_id: ${eval:'${n_shots} - 1'}
  use_foreground_mask: true
  min_episode_length: 5

# ---- DataLoader ----
dataloader:
  batch_size: 64
  num_workers: 6
  pin_memory: true
  persistent_workers: true

# ---- Optimizer ----
optimizer:
  _target_: torch.optim.AdamW
  lr: 3.0e-4
  betas: [0.9, 0.999]
  eps: 1.0e-8
  weight_decay: 1.0e-4

# ---- Training ----
training:
  device: "cuda:0"
  seed: 42
  num_epochs: ${eval:'40 * (1000 // ${n_shots})'}
  use_ema: true
  freeze_encoder: false
  lr_scheduler: cosine
  lr_warmup_steps: 200
  gradient_accumulate_every: 1
  rollout_every: "${eval: '1000 // ${n_shots}'}"
  checkpoint_every: "${eval: '1000 // ${n_shots}'}"
  val_every: "${eval: '1000 // ${n_shots}'}"
  skip_validation: true
  sample_every: "${eval: '1000 // ${n_shots}'}"
  max_train_steps: null
  max_val_steps: null
  tqdm_interval_sec: 1.0
  resume: true
  debug: false

# ---- EMA ----
ema:
  _target_: diffusion_policy.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

# ---- Eval ----
eval:
  num_episodes: 50
  max_episode_steps: 100
  save_video: true
  n_vis: 3
  video_dir: videos
  sim_freq: 1
  cpu: true

env:
  num_envs: 1
  shader_dir: rt-clean
  camera_width: ${img_size}
  camera_height: ${img_size}
  cameras: ${cameras}

# ---- Logging (wandb) ----
logging:
  project: rla-policy
  group: null
  name: ${setting}_fewshot_bc_${n_shots}shot/${now:%Y.%m.%d}_${now:%H.%M.%S}
  enable: true
  resume: true
  mode: online
  id: null
  tags:
    - fewshot
    - bc
    - ${n_shots}shot
    - ${task}
    - ${robot}

# ---- Checkpoints ----
checkpoint:
  topk:
    monitor_key: eval_success_rate
    mode: max
    k: 5
    format_str: "epoch={epoch:04d}-success={eval_success_rate:.3f}.ckpt"
  save_last_ckpt: true
  save_last_snapshot: false
